services:
  reader:
    image: ${PAPER_READER_IMAGE:-ghcr.io/untyee/paper-parallel-reader:latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_ALLOWED_ORIGINS: http://127.0.0.1:${APP_PORT:-8000},http://localhost:${APP_PORT:-8000}
      PAPER_DATA_DIR: /data
      ENABLE_OCR: "false"
      MODEL_CACHE_DIR: /data/model-cache
      HF_HOME: /data/model-cache/huggingface
      TORCH_HOME: /data/model-cache/torch
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    init: true
    restart: unless-stopped
