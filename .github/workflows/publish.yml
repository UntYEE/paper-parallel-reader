name: Test and publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/untyee/paper-parallel-reader

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.ocr.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          docker compose -f compose.yaml -f compose.ocr.yaml -f compose.build-ocr.yaml config --quiet

  test-windows-launcher:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Windows launchers
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ".\start.ps1"),
              [ref]$tokens,
              [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

          $probeFunction = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq "Invoke-DockerProbe"
          }, $true)
          if ($null -eq $probeFunction) {
              throw "Invoke-DockerProbe was not found."
          }
          Invoke-Expression $probeFunction.Extent.Text

          function docker {
              Write-Error "WARNING: daemon is not using the default seccomp profile" -ErrorAction Continue
              $global:LASTEXITCODE = 0
          }
          if ((Invoke-DockerProbe -Arguments @("info")) -ne 0) {
              throw "A harmless Docker stderr warning was treated as a failure."
          }

          $batchPath = Get-ChildItem -File -Filter "*-Windows.bat" | Select-Object -First 1
          if ($null -eq $batchPath) {
              throw "The Windows batch launcher was not found."
          }
          $batchBytes = [System.IO.File]::ReadAllBytes($batchPath.FullName)
          $batchText = [System.Text.Encoding]::ASCII.GetString($batchBytes)
          if (-not $batchText.Contains("`r`n") -or $batchText.Replace("`r`n", "").Contains("`n")) {
              throw "The Windows batch launcher must use CRLF line endings."
          }

  build:
    needs:
      - test
      - test-windows-launcher
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            channel: latest
            runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - target: runtime
            channel: latest
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
          - target: runtime-ocr
            channel: ocr
            runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - target: runtime-ocr
            channel: ocr
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.channel }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true

  publish:
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: latest
            suffix: ""
          - channel: ocr
            suffix: "-ocr"
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.channel }}
            type=semver,pattern={{version}}${{ matrix.suffix }}

      - name: Merge architecture images
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          mapfile -t final_tags < <(jq -r '.tags[]' <<< "${METADATA_JSON}")
          tag_arguments=()
          for tag in "${final_tags[@]}"; do
            tag_arguments+=(--tag "${tag}")
          done
          docker buildx imagetools create "${tag_arguments[@]}" \
            "${IMAGE_NAME}:${{ matrix.channel }}-amd64" \
            "${IMAGE_NAME}:${{ matrix.channel }}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${{ matrix.channel }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - test-windows-launcher
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create installation ZIP
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          archive="dist/paper-parallel-reader-${version}.zip"
          git archive --format=zip --prefix="paper-parallel-reader-${version}/" --output="${archive}" HEAD
          (cd dist && sha256sum "paper-parallel-reader-${version}.zip" > "paper-parallel-reader-${version}.zip.sha256")
          echo "RELEASE_ARCHIVE=${archive}" >> "${GITHUB_ENV}"
          echo "RELEASE_CHECKSUM=${archive}.sha256" >> "${GITHUB_ENV}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${RELEASE_ARCHIVE}" "${RELEASE_CHECKSUM}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${RELEASE_ARCHIVE}" "${RELEASE_CHECKSUM}" \
              --verify-tag --generate-notes
          fi
